<nz-modal [(nzVisible)]="visible" [nzTitle]="modalTitle" [nzClosable]="!loading" [nzMaskClosable]="false"
    [nzWidth]="500" [nzFooter]="null" (nzOnCancel)="handleCancel()">
    <!-- Template del título -->
    <ng-template #modalTitle>
        <div class="modal-header">
            <span nz-icon nzType="user" nzTheme="outline" class="modal-icon"></span>
            <span class="modal-title-text">Iniciar Sesión</span>
        </div>
    </ng-template>

    <!-- Contenido del modal -->
    <div class="modal-content" *nzModalContent>

        <div class="login-content">
            <div class="login-icon">
                <i nz-icon nzType="lock" nzTheme="outline"></i>
            </div>

            <p class="login-message">{{ message }}</p>

            <div class="consent-box">
                <label class="consent-row">
                    <input type="checkbox" [(ngModel)]="acceptedTerms" />
                    <span>
                        He leído y acepto los <a href="/terms" target="_blank" rel="noopener">Términos y
                            Condiciones</a> y la <a href="/privacy" target="_blank" rel="noopener">Política de
                            Privacidad</a>.
                    </span>
                </label>
                <label class="consent-row consent-promos">
                    <input type="checkbox" [(ngModel)]="acceptedPromos" />
                    <span>
                        <strong>Quiero ser de los primeros en saber</strong> de lanzamientos y ofertas exclusivas, y
                        recibir un saludo en mi cumpleaños. <em>(Opcional)</em>
                    </span>
                </label>
            </div>

            <button nz-button nzSize="large" nzBlock [nzLoading]="loading" [disabled]="!acceptedTerms"
                (click)="handleLogin()" class="google-login-btn">
                <span *ngIf="!loading" class="btn-content">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"
                        class="google-icon" />
                    <span>Continuar con Google</span>
                </span>
                <span *ngIf="loading">Iniciando sesión...</span>
            </button>

            <div class="login-footer">
                <p class="footer-text" *ngIf="!acceptedTerms">
                    Acepta los términos para continuar con Google.
                </p>
            </div>
        </div>

    </div>
</nz-modal>
