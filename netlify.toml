[build]
  publish = "dist/numer-ecomerce/browser"
  command = "ng build --configuration=production && npm run prerender"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["src/sitemap.xml"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

